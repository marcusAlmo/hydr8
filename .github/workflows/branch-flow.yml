name: Branch Flow

# Enforces the develop → main release pipeline.
# A PR whose base branch does not match the allowed source branch will
# fail this check, blocking the merge.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches:
      - main

jobs:
  enforce-flow:
    name: Enforce develop → main
    runs-on: ubuntu-latest

    steps:
      - name: Check branch flow
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          echo "PR: $HEAD → $BASE"
          if [ "$BASE" = "main" ] && [ "$HEAD" != "develop" ]; then
            echo "::error::main only accepts PRs from 'develop' (got '$HEAD')"
            exit 1
          fi
          echo "Branch flow OK: $HEAD → $BASE"

name: Branch Flow

# Enforces the develop → staging → main release pipeline.
# A PR whose base branch does not match the allowed source branch will
# fail this check, blocking the merge.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches:
      - main
      - staging

jobs:
  enforce-flow:
    name: Enforce develop → staging → main
    runs-on: ubuntu-latest

    steps:
      - name: Check branch flow
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          echo "PR: $HEAD → $BASE"
          case "$BASE" in
            main)
              if [ "$HEAD" != "staging" ]; then
                echo "::error::main only accepts PRs from 'staging' (got '$HEAD')"
                exit 1
              fi
              ;;
            staging)
              if [ "$HEAD" != "develop" ]; then
                echo "::error::staging only accepts PRs from 'develop' (got '$HEAD')"
                exit 1
              fi
              ;;
          esac
          echo "Branch flow OK: $HEAD → $BASE"

version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=hydr8
    ports:
      - "5432:5432"

  server:
    build: ./server
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./server:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/hydr8
      - DEBUG=True
      - SECRET_KEY=django-insecure-5=0nbp%kzp8ln(#g!y5692oj(ah9v!8pj#txu)wd3*1&2e6rea
    depends_on:
      - db

volumes:
  postgres_data:

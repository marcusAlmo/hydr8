{% if url %}
<a href="{{ url }}" class="btn btn-primary {{ custom_classes }}" {% if attrs %}{{ attrs|safe }}{% endif %}>
    {{ text }}
</a>
{% else %}
<button class="btn btn-primary {{ custom_classes }}" {% if type %}type="{{ type }}"{% else %}type="button"{% endif %} {% if attrs %}{{ attrs|safe }}{% endif %} {% if onclick %}onclick="{{ onclick }}"{% endif %}>
    {{ text }}
    {% if htmx_indicator %}
    <span class="htmx-indicator">{{ htmx_indicator_text|default="..." }}</span>
    {% endif %}
</button>
{% endif %}

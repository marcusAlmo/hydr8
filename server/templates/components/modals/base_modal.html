<div id="{{ modal_id|default:'base-modal-overlay' }}" 
     class="modal-overlay" 
     x-data="{ open: true }"
     x-show="open"
     @keydown.escape.window="open = false; setTimeout(() => document.getElementById('{{ modal_id|default:'base-modal-overlay' }}')?.remove(), 200)">
    <div class="modal-card glass-card" 
         @click.outside="open = false; setTimeout(() => document.getElementById('{{ modal_id|default:'base-modal-overlay' }}')?.remove(), 200)">
        
        <div class="modal-header">
            <div>
                {% if title %}<h2 class="modal-title">{{ title }}</h2>{% endif %}
                {% if subtitle %}<p class="modal-subtitle">{{ subtitle }}</p>{% endif %}
            </div>
            <button type="button" 
                    class="modal-close-btn" 
                    @click="open = false; setTimeout(() => document.getElementById('{{ modal_id|default:'base-modal-overlay' }}')?.remove(), 200)"
                    aria-label="Close modal">
                &times;
            </button>
        </div>
        
        <div class="modal-body">
            {% block modal_content %}{% endblock %}
        </div>

        {% if has_footer %}
        <div class="modal-footer">
            {% block modal_footer %}{% endblock %}
        </div>
        {% endif %}
    </div>
</div>

<style>
    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(2, 6, 23, 0.7);
        backdrop-filter: blur(8px);
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        animation: modalFadeIn 0.25s ease-out;
    }

    .modal-card {
        width: 100%;
        max-width: {{ max_width|default:'520px' }};
        background: var(--surface-container, #0f172a);
        border: 1px solid var(--outline-variant, rgba(226, 232, 240, 0.15));
        border-radius: var(--rounded-lg, 0.75rem);
        box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.5);
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
        animation: modalSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
    }

    .modal-title {
        font-family: var(--font-display, 'Geist', sans-serif);
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--on-surface, #ffffff);
    }

    .modal-subtitle {
        font-size: 0.875rem;
        color: var(--on-surface-variant, #94a3b8);
        margin-top: 0.25rem;
    }

    .modal-close-btn {
        background: transparent;
        border: none;
        color: var(--on-surface-variant, #94a3b8);
        font-size: 1.5rem;
        cursor: pointer;
        line-height: 1;
    }

    .modal-close-btn:hover {
        color: var(--on-surface, #ffffff);
    }

    .modal-footer {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 0.75rem;
        padding-top: 1rem;
        border-top: 1px solid var(--outline-variant, rgba(226, 232, 240, 0.1));
    }

    @keyframes modalFadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    @keyframes modalSlideUp {
        from { transform: translateY(16px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }
</style>

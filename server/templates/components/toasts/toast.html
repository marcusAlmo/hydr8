<div id="toast-{{ id|default:1000 }}" 
     class="toast toast-{{ type|default:'success' }}" 
     style="--toast-duration: {{ duration|default:4000 }}ms"
     hx-swap-oob="beforeend:#toast-container"
     x-data="{ show: true }"
     x-show="show"
     x-cloak
     x-init="setTimeout(() => show = false, {{ duration|default:4000 }})"
     x-transition:enter="transition ease-out duration-300 transform"
     x-transition:enter-start="opacity-0 translate-y-4 translate-x-8 scale-95"
     x-transition:enter-end="opacity-100 translate-y-0 translate-x-0 scale-100"
     x-transition:leave="transition ease-in duration-200 transform"
     x-transition:leave-start="opacity-100 translate-y-0 translate-x-0 scale-100"
     x-transition:leave-end="opacity-0 -translate-y-4 translate-x-8 scale-95"
     role="alert">
    <div class="toast-indicator-strip" aria-hidden="true"></div>
    <div class="toast-body">
        {% if title %}<strong class="toast-title">{{ title }}</strong>{% endif %}
        <span class="toast-message">{{ message }}</span>
    </div>
    <button type="button" class="toast-close" @click="show = false" aria-label="Close notification">
        &times;
    </button>
</div>

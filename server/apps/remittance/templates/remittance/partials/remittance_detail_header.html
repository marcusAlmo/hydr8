<header class="flex justify-between items-center w-full px-margin-page py-4 bg-background z-10 border-b border-outline-variant/10">
    <div class="flex items-center gap-4">
        <a href="{% url 'remittance:history' %}"
           class="inline-flex items-center justify-center w-10 h-10 rounded-lg hover:bg-surface-container-low transition-colors"
           title="Back to remittance history">
            <span class="material-symbols-outlined text-[20px] text-on-surface">arrow_back</span>
        </a>
        <div>
            <h2 class="font-headline-md text-headline-md font-black text-primary">Remittance Detail</h2>
            <p class="text-body-sm text-on-surface-variant">{{ remittance.date }} · {{ remittance.status }}</p>
            <p class="text-body-sm text-on-surface-variant/80">
                {{ remittance.status_date_label }} by <span class="font-semibold text-on-surface">{{ remittance.handler_name }}</span> on {{ remittance.status_date }}
            </p>
        </div>
    </div>
</header>

<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Login | Hydr8</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "inverse-primary": "#89ceff",
                    "surface-dim": "#cfdaf2",

                    "primary-fixed": "#c9e6ff",

                    "inverse-surface": "#263143",
                    "surface-variant": "#d8e3fb",

                    "secondary-container": "#d0e1fb",
                    "on-primary-fixed-variant": "#004c6e",
                    "tertiary-fixed-dim": "#68dba9",
                    "on-primary-container": "#003751",
                    "surface-container": "#e7eeff",
                    "surface-container-lowest": "#ffffff",
                    "on-secondary-fixed": "#0b1c30",
                    "error": "#ba1a1a",

                    "on-tertiary": "#ffffff",

                    "on-secondary": "#ffffff",
                    "on-tertiary-container": "#003c27",
                    "tertiary-fixed": "#85f8c4",
                    "surface-container-low": "#f0f3ff",
                    "surface-bright": "#f9f9ff",

            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",

                    "margin-page": "1.5rem",
                    "gutter": "1rem",

                    "data-mono": ["Geist Mono"],
                    "headline-sm": ["Geist"],
                    "label-caps": ["Geist"],
                    "body-sm": ["Geist"],
                    "headline-md": ["Geist"],
                    "headline-lg": ["Geist"],
                    "body-md": ["Geist"]
            },
            "fontSize": {
                    "data-mono": ["14px", {"lineHeight": "20px", "letterSpacing": "-0.01em", "fontWeight": "500"}],
                    "headline-sm": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],

          },
        },
      }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        
        .abyss-bg {
            background-color: #0F172A; /* Requested Abyss specifically */
        }

        .auth-card-shimmer {
            position: relative;
            overflow: hidden;
        }
        
        .auth-card-shimmer::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(14, 165, 233, 0.03), transparent);
            transform: rotate(45deg);
            animation: shimmer 10s infinite linear;
            pointer-events: none;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }
    </style>
<script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="bg-background font-body-md text-on-background selection:bg-primary-container selection:text-on-primary-container">
<div class="min-h-screen flex">
<!-- Left Panel (Abyss) -->
<div class="hidden md:flex flex-col justify-center items-center w-1/2 abyss-bg relative overflow-hidden">
<!-- Atmospheric micro-interaction element -->
<div class="absolute inset-0 opacity-20 pointer-events-none">
<div class="absolute top-0 -left-1/4 w-1/2 h-1/2 bg-primary rounded-full blur-[120px]"></div>
<div class="absolute bottom-0 -right-1/4 w-1/2 h-1/2 bg-tertiary rounded-full blur-[120px]"></div>
</div>
<div class="relative z-10 flex flex-col items-center text-center space-y-2">
<!-- Data from JSON: header_title: "Hydr8", header_subtext: "Water. Delivered. Managed." -->
<h1 class="font-headline-lg text-headline-xlg font-black tracking-tight text-primary-fixed">
                    Hydr8
                </h1>
<p class="font-body-md text-body-md text-secondary-fixed-dim uppercase tracking-[0.2em] opacity-80">
                    Water. Delivered. Managed.
                </p>
</div>
<!-- Subtle Grid Pattern Overlay -->
<div class="absolute inset-0 opacity-[0.03]" style="background-image: radial-gradient(#fff 1px, transparent 1px); background-size: 32px 32px;"></div>
</div>
<!-- Right Panel (Login Surface) -->
<div class="flex-1 flex flex-col justify-center px-margin-page py-12 bg-surface-bright">
<!-- Mobile Logo (Visible only on mobile) -->
<div class="md:hidden flex flex-col items-center mb-12">
<h1 class="font-headline-lg text-headline-lg font-black text-primary">Hydr8</h1>
<p class="font-body-sm text-body-sm text-outline tracking-wider">Water. Delivered. Managed.</p>
</div>
<div class="mx-auto w-full max-w-[400px]">
<div class="auth-card-shimmer bg-surface-container-lowest p-8 border border-outline-variant shadow-sm rounded-lg">
<div class="mb-8">
<h2 class="font-headline-md text-headline-md text-on-surface">Sign In</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Access the hydration management dashboard</p>
</div>
{% include "users/partials/login_form.html" %}
<div class="mt-8 pt-6 border-t border-outline-variant/30 text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                            Internal Enterprise System. Unauthorized access is prohibited.
                        </p>
</div>
</div>
<!-- Footer / Support Info -->
<div class="mt-8 flex justify-center items-center gap-6 opacity-60 grayscale">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">verified_user</span>
<span class="font-label-caps text-label-caps uppercase">SECURE PORTAL</span>
</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">sync</span>
<span class="font-label-caps text-label-caps uppercase">REAL-TIME DATA</span>
</div>
</div>
</div>
</div>
</div>
<!-- AI Insights Panel Shimmer effect for future context but applied here to subtle footer branding -->

</body></html>

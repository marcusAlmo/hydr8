<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Hydr8 CRM</title>
    <meta name="description" content="Hydr8 CRM - Next generation customer relationship management built for performance.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Premium Dark Theme Tokens */
            --bg-primary: #0B0E14;
            --bg-secondary: rgba(22, 27, 34, 0.6);
            --text-primary: #F0F6FC;
            --text-secondary: #8B949E;
            --accent-glow: #3B82F6;
            --accent-glow-secondary: #8B5CF6;
            
            /* Glassmorphism */
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-blur: blur(16px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* Dynamic Background Gradients */
        .ambient-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 60%);
            opacity: 0.15;
            top: -200px;
            left: -200px;
            filter: blur(80px);
            z-index: 0;
            animation: pulse-slow 8s infinite alternate ease-in-out;
        }
        
        .ambient-glow-alt {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--accent-glow-secondary) 0%, transparent 60%);
            opacity: 0.15;
            bottom: -100px;
            right: -100px;
            filter: blur(80px);
            z-index: 0;
            animation: pulse-slow 10s infinite alternate-reverse ease-in-out;
        }

        @keyframes pulse-slow {
            0% { transform: scale(0.8) translate(0, 0); opacity: 0.1; }
            100% { transform: scale(1.2) translate(50px, 50px); opacity: 0.2; }
        }

        /* Navbar */
        nav {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 5%;
            background: linear-gradient(to bottom, rgba(11, 14, 20, 0.9), transparent);
        }

        .brand {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            background: linear-gradient(to right, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Main Content area */
        main {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        /* Glassmorphism Card */
        .hero-card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 4rem;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .hero-card:hover {
            transform: translateY(-8px);
        }

        .hero-title {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            letter-spacing: -0.02em;
        }
        
        .hero-title span {
            background: linear-gradient(135deg, var(--accent-glow) 0%, var(--accent-glow-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            font-size: 1.125rem;
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            line-height: 1.6;
            font-weight: 300;
        }

        /* Premium Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.875rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 9999px;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-glow) 0%, var(--accent-glow-secondary) 100%);
            color: white;
            box-shadow: 0 4px 14px 0 rgba(59, 130, 246, 0.39);
            position: relative;
            overflow: hidden;
        }
        
        /* Button inner glare effect */
        .btn-primary::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: rgba(255,255,255,0.1);
            transform: rotate(45deg) scale(0);
            transition: transform 0.6s ease;
        }

        .btn-primary:hover {
            box-shadow: 0 6px 20px 0 rgba(59, 130, 246, 0.5);
            transform: scale(1.05);
        }
        
        .btn-primary:hover::after {
            transform: rotate(45deg) scale(1);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--glass-border);
            margin-left: 1rem;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        
        /* Login Form within modal (placeholder for HTMX) */
        .login-container {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>
    <div class="ambient-glow-alt"></div>

    <nav>
        <div class="brand">Hydr8</div>
        <!-- This button can trigger an HTMX request to load the login form in a modal -->
        <a href="/login/" class="btn btn-secondary" hx-get="/login/" hx-target="#modal-root" hx-swap="innerHTML">Log In</a>
    </nav>

    <main>
        <div class="hero-card">
            <h1 class="hero-title">Next-Gen <span>CRM</span> Platform</h1>
            <p class="hero-subtitle">
                Supercharge your customer relationships with high-performance workflows, deep analytics, and privacy-first architecture. Built for scale.
            </p>
            <div class="login-container">
                <a href="/login/" class="btn btn-primary" hx-get="/login/" hx-target="#modal-root" hx-swap="innerHTML">
                    Access Dashboard
                </a>
            </div>
        </div>
    </main>
    
    <!-- HTMX Modal Root for dynamic form loading -->
    <div id="modal-root"></div>

    <!-- Optional: Include HTMX for standardizing dynamic interactions without JS frameworks -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</body>
</html>

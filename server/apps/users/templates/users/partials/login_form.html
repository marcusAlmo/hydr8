<form hx-post="{% url 'users:login' %}" hx-target="this" hx-swap="outerHTML" class="space-y-4">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next|default:'' }}">

    {% if form.non_field_errors %}
    <div class="p-4 bg-error-container border-l-4 border-error flex items-center gap-3 rounded-md mb-4">
        <span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1;">error</span>
        <p class="font-body-sm text-on-error-container font-medium text-sm">{{ form.non_field_errors.0 }}</p>
    </div>
    {% endif %}

    <!-- Username Field -->
    <div class="space-y-2">
        <label class="block font-label-caps text-xs font-bold text-on-surface-variant uppercase tracking-wider" for="id_username">Username</label>
        <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline text-[20px]">person</span>
            <input class="w-full pl-10 pr-4 py-3 bg-transparent border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 rounded-lg transition-all duration-200 outline-none font-body-md text-on-surface text-sm" id="id_username" name="username" placeholder="Enter your username" required type="text" value="{{ form.username.value|default:'' }}">
        </div>
        {% if form.username.errors %}
        <p class="text-xs text-error font-medium mt-1">{{ form.username.errors.0 }}</p>
        {% endif %}
    </div>

    <!-- Password Field -->
    <div class="space-y-2" x-data="{ show: false }">
        <label class="block font-label-caps text-xs font-bold text-on-surface-variant uppercase tracking-wider" for="id_password">Password</label>
        <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline text-[20px]">lock</span>
            <input class="w-full pl-10 pr-11 py-3 bg-transparent border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 rounded-lg transition-all duration-200 outline-none font-body-md text-on-surface text-sm" id="id_password" name="password" placeholder="••••••••" required :type="show ? 'text' : 'password'">
            <button type="button" @click="show = !show" class="absolute right-2 top-1/2 -translate-y-1/2 p-1.5 rounded-md text-outline hover:text-on-surface hover:bg-surface-container transition-colors cursor-pointer" :aria-label="show ? 'Hide password' : 'Show password'" :aria-pressed="show">
                <span class="material-symbols-outlined text-[20px]" x-show="!show" aria-hidden="true">visibility</span>
                <span class="material-symbols-outlined text-[20px]" x-show="show" x-cloak aria-hidden="true">visibility_off</span>
            </button>
        </div>
        {% if form.password.errors %}
        <p class="text-xs text-error font-medium mt-1">{{ form.password.errors.0 }}</p>
        {% endif %}
    </div>

    <!-- Action Buttons -->
    <div class="flex flex-col gap-3 pt-4">
        <button class="w-full bg-primary hover:bg-primary/90 text-on-primary py-3 px-4 font-semibold text-sm rounded-lg transition-all active:scale-[0.98] shadow-sm flex items-center justify-center gap-2 cursor-pointer" type="submit">
            <span>Sign In</span>
            <span class="material-symbols-outlined text-[20px]">login</span>
        </button>
    </div>
</form>

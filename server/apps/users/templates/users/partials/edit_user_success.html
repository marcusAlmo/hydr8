{% comment %}
Edit user success — shown in the drawer after a successful user edit.
Displays a success message and closes the drawer on button click.
{% endcomment %}
<div
    class="rounded-lg border border-tertiary/30 bg-tertiary/5 p-6 space-y-4"
    x-data="{ shown: true }"
    x-show="shown"
    x-init="setTimeout(() => { $dispatch('close-drawer'); }, 1500)"
>
    <div class="flex items-start gap-3">
        <div class="w-10 h-10 rounded-full bg-tertiary/10 flex items-center justify-center flex-shrink-0">
            <span class="material-symbols-outlined text-tertiary text-[22px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
        </div>
        <div class="flex-1">
            <h4 class="font-headline-sm text-base font-bold text-on-surface">User Updated</h4>
            <p class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">
                {{ target_user.username }}'s profile has been saved successfully.
            </p>
        </div>
    </div>

    <div class="flex justify-end">
        <button
            @click="$dispatch('close-drawer')"
            class="px-4 py-2 bg-surface-container-high hover:bg-surface-container text-on-surface font-body-sm font-bold text-sm rounded-lg transition-colors cursor-pointer"
        >
            Close
        </button>
    </div>
</div>

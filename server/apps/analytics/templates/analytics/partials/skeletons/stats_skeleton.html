{% comment %}
Skeleton placeholder for the stats row — 6/3/3 grid of shimmer cards.
Matches the shape of stats_row.html so the swap doesn't cause layout shift.
{% endcomment %}
<section class="grid grid-cols-1 md:grid-cols-12 gap-gutter mb-6">
    <!-- 6-col card skeleton -->
    <div class="md:col-span-6 bg-surface-container-lowest border border-outline-variant/30 rounded-xl shadow-sm p-4 border-t-2 border-t-outline-variant/20 flex flex-col justify-between hydr8-skeleton">
        <div class="flex justify-between items-start mb-2">
            <div class="hydr8-skeleton-bar h-4 w-32 rounded"></div>
            <div class="hydr8-skeleton-bar h-6 w-6 rounded"></div>
        </div>
        <div>
            <div class="hydr8-skeleton-bar h-9 w-48 rounded mb-2"></div>
            <div class="hydr8-skeleton-bar h-4 w-36 rounded"></div>
        </div>
    </div>
    <!-- 3-col card skeleton -->
    <div class="md:col-span-3 bg-surface-container-lowest border border-outline-variant/30 rounded-xl shadow-sm p-4 border-t-2 border-t-outline-variant/20 flex flex-col justify-between hydr8-skeleton">
        <div class="flex justify-between items-start mb-2">
            <div class="hydr8-skeleton-bar h-4 w-24 rounded"></div>
            <div class="hydr8-skeleton-bar h-6 w-6 rounded"></div>
        </div>
        <div>
            <div class="hydr8-skeleton-bar h-7 w-28 rounded mb-2"></div>
            <div class="hydr8-skeleton-bar h-4 w-24 rounded"></div>
        </div>
    </div>
    <!-- 3-col card skeleton -->
    <div class="md:col-span-3 bg-surface-container-lowest border border-outline-variant/30 rounded-xl shadow-sm p-4 border-t-2 border-t-outline-variant/20 flex flex-col justify-between hydr8-skeleton">
        <div class="flex justify-between items-start mb-2">
            <div class="hydr8-skeleton-bar h-4 w-28 rounded"></div>
            <div class="hydr8-skeleton-bar h-6 w-6 rounded"></div>
        </div>
        <div>
            <div class="hydr8-skeleton-bar h-7 w-20 rounded mb-2"></div>
            <div class="hydr8-skeleton-bar h-4 w-20 rounded"></div>
        </div>
    </div>
</section>

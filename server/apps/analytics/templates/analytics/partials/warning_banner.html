{% comment %}
Warning banner shown when today's remittance has not been created yet.
Expects context:
  - warning_banner: { show, title, message, cta_text }
{% endcomment %}
{% if warning_banner.show %}
<section class="mb-8">
    <div class="bg-[#D97706]/10 border border-[#D97706]/20 rounded-lg p-4 flex flex-col md:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-[#D97706]">warning</span>
            <div>
                <p class="font-headline-sm text-headline-sm text-[#D97706]">{{ warning_banner.title }}</p>
                <p class="font-body-sm text-body-sm text-[#D97706]/80">{{ warning_banner.message }}</p>
            </div>
        </div>
        <button class="px-6 py-2 bg-[#D97706] text-white font-bold rounded hover:bg-[#B45309] transition-colors shadow-sm flex items-center gap-2">
            <span class="material-symbols-outlined">add_circle</span>
            {{ warning_banner.cta_text }}
        </button>
    </div>
</section>
{% endif %}
